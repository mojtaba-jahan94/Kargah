<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Deep Artistic Obsidian -->
    <linearGradient id="canvasBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#151226" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Luxury Gold & Amber Gradient -->
    <linearGradient id="artGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Painter Palette Gradient -->
    <linearGradient id="paletteGrad" x1="10%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <!-- Brush Bristle Gradient -->
    <linearGradient id="brushTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Base Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#canvasBg)" />
  <rect width="508" height="508" x="2" y="2" rx="126" stroke="url(#artGold)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Minimal Artist's Palette Contour -->
  <path d="M 230 110 
           C 140 110, 95 170, 95 255 
           C 95 340, 160 405, 255 405 
           C 285 405, 305 385, 325 375 
           C 340 368, 355 365, 375 372 
           C 405 380, 425 355, 422 320 
           C 418 280, 410 250, 395 210 
           C 365 140, 310 110, 230 110 Z" 
        fill="url(#paletteGrad)" 
        fill-opacity="0.16" 
        stroke="url(#artGold)" 
        stroke-width="12" 
        stroke-linejoin="round" />

  <!-- Thumb Hole (clean minimalist ring) -->
  <circle cx="345" cy="315" r="28" fill="#0b0f19" stroke="url(#artGold)" stroke-width="8" />

  <!-- Three Pure Pigment Wells (RGB of Painting: Ultramarine, Vermilion, Gold) -->
  <circle cx="165" cy="205" r="22" fill="#38bdf8" filter="url(#iconGlow)" />
  <circle cx="205" cy="290" r="24" fill="#f43f5e" filter="url(#iconGlow)" />
  <circle cx="265" cy="180" r="22" fill="#fbbf24" filter="url(#iconGlow)" />

  <!-- Fluid Sweep Paint Stroke -->
  <path d="M 170 340 C 210 370, 270 360, 310 330" 
        stroke="#f59e0b" 
        stroke-width="10" 
        stroke-linecap="round" 
        opacity="0.6" />

  <!-- Angled Fine-Art Paintbrush (قلم‌مو نقاشی مینیمال) -->
  <g transform="rotate(32 310 210)">
    <!-- Slender Handle -->
    <path d="M 302 40 L 318 40 L 316 230 L 304 230 Z" fill="url(#artGold)" />
    <!-- Metallic Ferrule -->
    <path d="M 300 230 L 320 230 L 322 265 L 298 265 Z" fill="#e2e8f0" />
    <line x1="300" y1="248" x2="320" y2="248" stroke="#94a3b8" stroke-width="2" />
    <!-- Natural Bristle Tip loaded with paint -->
    <path d="M 298 265 C 298 295, 305 320, 310 330 C 315 320, 322 295, 322 265 Z" 
          fill="url(#brushTip)" 
          filter="url(#iconGlow)" />
    <!-- Glowing Paint Tip Drop -->
    <circle cx="310" cy="335" r="8" fill="#fbbf24" filter="url(#iconGlow)" />
  </g>
</svg>